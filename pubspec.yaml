name: offline_english_tutor
description: "معلم الإنجليزية الذكي - Offline AI English Tutor Flutter Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Multi-Image OCR & Crop
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  google_mlkit_text_recognition: ^0.13.0

  # Local GGUF LLM Inferences
  flutter_llama: ^1.2.1
  llama_cpp_dart: ^0.2.2

  # Resumable Model Downloader & Storage
  dio: ^5.7.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI & Utilities
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
