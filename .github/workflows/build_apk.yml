name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze || true

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: "Offline English Tutor APK v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### معلم الإنجليزية الذكي - Offline AI (v1.0.0)
            
            تم بناء ملف التطبيق بنجاح عبر GitHub Actions:
            - **الملف:** `app-release.apk`
            - **المعمارية:** `arm64-v8a`, `x86_64`
            - **النمط:** 100% Offline On-Device AI
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
