name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Align Native Gradle with Runner Flutter SDK
        run: |
          set -e
          echo "=== Flutter Version ==="
          flutter --version
          
          echo "=== Generating reference project ==="
          rm -rf /tmp/ref_app
          flutter create --org com.example.offline_english_tutor --project-name offline_english_tutor /tmp/ref_app
          
          # Replace gradle wrapper with the exact official distribution
          rm -rf android/gradle
          cp -rf /tmp/ref_app/android/gradle android/
          
          # Check whether ref_app uses kts or groovy
          if [ -f /tmp/ref_app/android/settings.gradle.kts ]; then
            echo "Runner uses Kotlin DSL (.kts)"
            rm -f android/settings.gradle android/build.gradle android/app/build.gradle
            cp /tmp/ref_app/android/settings.gradle.kts android/settings.gradle.kts
            cp /tmp/ref_app/android/build.gradle.kts android/build.gradle.kts
            cp /tmp/ref_app/android/app/build.gradle.kts android/app/build.gradle.kts
            
            python3 -c "
import re
with open('android/app/build.gradle.kts', 'r') as f:
    content = f.read()

# Replace minSdk
content = re.sub(r'minSdk\s*=.*', 'minSdk = 24', content)

# Inject ndk abiFilters in defaultConfig
ndk_block = '''        ndk {
            abiFilters.addAll(listOf(\"arm64-v8a\", \"x86_64\"))
        }'''
content = re.sub(r'(defaultConfig\s*\{)', r'\1\n' + ndk_block, content)

# Inject dependencies
dep_block = '''dependencies {
    implementation(\"androidx.appcompat:appcompat:1.7.0\")
    implementation(\"com.google.mlkit:text-recognition:16.0.1\")
}'''
content += '\n' + dep_block + '\n'

with open('android/app/build.gradle.kts', 'w') as f:
    f.write(content)
"
            echo "=== Patched app/build.gradle.kts ==="
            cat android/app/build.gradle.kts
          else
            echo "Runner uses Groovy DSL (.gradle)"
            rm -f android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts
            cp /tmp/ref_app/android/settings.gradle android/settings.gradle
            cp /tmp/ref_app/android/build.gradle android/build.gradle
            cp /tmp/ref_app/android/app/build.gradle android/app/build.gradle
            
            python3 -c "
import re
with open('android/app/build.gradle', 'r') as f:
    content = f.read()

content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 24', content)
content = re.sub(r'minSdk\s+.*', 'minSdk 24', content)

ndk_block = '''        ndk {
            abiFilters \"arm64-v8a\", \"x86_64\"
        }'''
content = re.sub(r'(defaultConfig\s*\{)', r'\1\n' + ndk_block, content)

dep_block = '''dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}'''
content += '\n' + dep_block + '\n'

with open('android/app/build.gradle', 'w') as f:
    f.write(content)
"
            echo "=== Patched app/build.gradle ==="
            cat android/app/build.gradle
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze || true

      - name: Build Android Release APK
        run: flutter build apk --release --verbose --no-tree-shake-icons

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: "Offline English Tutor APK v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### معلم الإنجليزية الذكي - Offline AI (v1.0.0)
            
            تم بناء ملف التطبيق بنجاح عبر GitHub Actions:
            - **الملف:** `app-release.apk`
            - **المعمارية:** `arm64-v8a`, `x86_64`
            - **النمط:** 100% Offline On-Device AI
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
